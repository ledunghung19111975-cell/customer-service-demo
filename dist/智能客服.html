/* Product copy and a narrowly scoped update for the previous bundled defaults.
 * Legacy text below is migration data, not rendered product copy.
 * Never replace arbitrary customer/staff messages, notes, or form drafts.
 */
(function (root) {
  'use strict';
  const VERSION = 1;
  const greeting = '您好，请描述您遇到的问题。您也可以查询订单或申请售后。';
  const legacyGreeting = '你好，我是青禾小助。订单进度、商品使用或售后问题，都可以在这里告诉我。请勿发送密码、验证码或完整银行卡信息。';
  const customers = {
    C001: ['林小夏', '客户 001', 'xiaoxia@example.test', 'customer001@example.test'],
    C002: ['陈一诺', '客户 002', 'yinuo@example.test', 'customer002@example.test'],
    C003: ['周安', '客户 003', 'zhouan@example.test', 'customer003@example.test']
  };
  const staff = {lin: ['客服小林', '客服 01'], zhou: ['客服小周', '客服 02']};
  const sources = {
    KB001: ['青禾生活 / 售后服务政策', '售后服务政策'],
    KB002: ['青禾生活 / 商品使用说明', '商品使用说明'],
    KB003: ['青禾生活 / 服务说明', '客服服务说明']
  };
  function updateSource(object, id) {
    const rule = sources[id || object?.id];
    if (!object || object.version !== 1 || !rule || object.source !== rule[0]) return false;

  }

    if (!input || input.schema !== 4 || (input.copyVersion || 0) >= VERSION) return {state: input, changed: false};

    const people = [...s.customers, ...s.staff];
    // Some historical labels have no identity ID; leave colliding names intact.
    const names = Object.fromEntries(Object.entries(identities)
      .filter(([id, rule]) => !people.some(p => p.id !== id && p.name === rule[0]))
      .map(([, rule]) => [rule[0], rule[1]]));
    const updateName = (object, key, id) => {
      if (!object) return;
      const rule = identities[id];
      if (id) { if (rule && object[key] === rule[0]) object[key] = rule[1]; }

    };
    for (const customer of s.customers) {
      const rule = customers[customer.id];
      if (!rule) continue;
      if (customer.name === rule[0]) customer.name = rule[1];
      if (customer.email === rule[2]) customer.email = rule[3];
      if (customer.level === '青禾会员') customer.level = '会员';
    }
    for (const person of s.staff) {
      const rule = staff[person.id];
      if (rule && person.name === rule[0]) person.name = rule[1];
    }
    for (const conversation of s.conversations) {
      for (const [index, m] of conversation.messages.entries()) {
        // Only the original, generated first-message welcome is replaceable.
        if (index === 0 && m.role === 'bot' && !m.caseId && !m.citation && m.body === legacyGreeting) m.body = greeting;
        if (m.role === 'agent') updateName(m, 'author');
        if (m.role === 'system') {
          for (const [oldName, newName] of Object.values(staff)) {
            if (!names[oldName]) continue;
            if (m.body === `${oldName}已接入，接下来由人工为你服务。`) m.body = `${newName}已接入，接下来由人工为您服务。`;
            if (m.body === `${oldName}将继续为你服务，已有信息会保留。`) m.body = `${newName}将继续为您服务，已有信息会保留。`;
          }
        }
        if (m.role === 'bot') updateSource(m.citation);
      }

(function(root){

  V.flow=function(s,ui){const draft=ui.drafts['flow:new'],v=draft||s.flow.draft||s.flow.live;return `${heading('接待策略与测试','管理诉求路由、人工交接与售后受理规则，验证后发布。',pill('发布版本 v'+s.flow.live.version,'good'))}<section class="panel"><div class="panel-heading"><h2>接待路径</h2><span class="muted">每段新咨询保存当时的策略版本</span></div><div class="flow-strip">${[['chat','客户表达','接收问题与已知订单'],['flow','识别诉求','多诉求分开处理'],['book','执行服务','知识 / 订单 / 售后'],['shield','核对边界','来源 / 归属 / 明确确认'],['users','完成或交接','结果记录 / 人工接续']].map(([glyph,title,sub],i)=>`${i?'<span class="flow-arrow">→</span>':''}<div class="flow-step">${icon(glyph,23)}<strong>${title}</strong><small>${sub}</small></div>`).join('')}</div></section><div class="overview-grid"><section class="panel"><div class="panel-heading"><h2>策略草稿</h2>${s.flow.draft?pill('待发布'):pill('与已发布策略一致')}</div><form data-form="flow" data-id="new">${field('明确转人工的触发词','humanWords',Array.isArray(v.humanWords)?v.humanWords.join(','):v.humanWords,'text','required')}<label class="field"><span>售后受理</span><select name="intakeEnabled">${options([['true','开启：核对订单后，填写并确认申请'],['false','关闭：交给人工协助登记']],String(v.intakeEnabled))}</select></label><p class="muted small-text">客户明确要求人工始终优先；订单必须属于当前客户。上述边界不可通过配置关闭。</p><div class="form-footer"><button class="btn primary" type="submit">保存策略草稿</button></div></form><div class="release-actions">${b('运行回归','test-flow','','',!s.flow.draft||draft?'disabled':'')}${b('发布策略','publish-flow','','primary',!s.flow.validation?.passed||draft?'disabled':'')}</div></section><section class="panel"><div class="panel-heading"><h2>草稿测试</h2>${pill('隔离运行')}</div><form data-form="flow-query" data-id="new">${field('输入问题','query',ui.drafts['flow-query:new']?.query||'查物流 SO20260926001，再申请退货','textarea','required')}<label class="checkbox"><input type="checkbox" name="orderFailure" value="true" ${ui.drafts['flow-query:new']?.orderFailure?'checked':''}>本次测试让订单查询失败</label><p class="muted small-text">按客户 001 的订单权限运行。测试不会创建客户会话、工单或修改接待配置。</p><p class="muted small-text" data-flow-   V.quality=function(s,ui,role){const list=s.gaps;return `${heading(role==='manager'?'质量复核':'服务改进队列',role==='manager'?'复核服务问题，分派整改并验收。':'根据已确认的问题维护知识，跟进整改进度。',pill('知识与答复问题'))}<div class="quality-list">${list.map(g=>{const conv=s.conversations.find(c=>c.id===g.conversationId),reply=conv?.messages.find(m=>m.role==='bot'&&m.body!=='');return `<section class="panel quality-card"><div class="row between"><div class="row">${pill(g.category)}${pill(g.status,g.status==='closed'?'good':g.status==='new'?'warn':'')}</div><small class="muted">${e(g.id)} · ${date(g.createdAt,true)}</small></div><h2>${e(g.query)}</h2><p class="muted small-text">来自会话 ${e(g.conversationId)}。原始问题在验收时原样重放，不改写成更容易通过的问法。</p>${g.review?`<div class="review-note"><strong>复核依据</strong><p>${e(g.review)}</p>${g.cause?`<small>根因：${e(g.cause)}</small>`:''}</div>`:''}${g.knowledgeId?`<p class="small-text">关联整改知识：${e(g.knowledgeId)} · ${e(s.knowledge.find(k=>k.id===g.knowledgeId)?.live?.title||'待发布草稿')}</p>`:''}<div class="row">${role==='manager'&&!['closed','dismissed'].includes(g.status)?b('复核线索','review-gap',g.id,'small'):''}${role==='operator'&&['confirmed','fixing'].includes(g.status)?`${b('新增整改知识','new-gap-knowledge',g.id,'small')}${b('关联整改知识','link-gap',g.id,'small')}`:''}${role==='manager'&&g.status==='fixing'?b('验证原问题并验收','accept-gap',g.id,'primary small'):''}${g.status==='closed'?pill('已通过原问题验证与全量回归','good'):''}</div>${g.acceptance?`<p class="small-text">验收说明：${e(g.acceptance)}</p>`:''}${role==='manager'?`<details><summary>查看服务证据</summary><div class="evidence-messages">${conv?.messages.filter(m=>m.role!=='system').map(m=>`<p><strong>${e(m.author||m.role)}</strong> ${e(m.body)}</p>`).join('')||'原会话不可用'}</div></details>`:''}</section>`;}).join('')||`<div class="panel">${empty('暂无质量待办','未命中知识或客服标记问题后，会形成待复核线索。')}</div>`}</div>`;};

  V.integrations=function(){return `${heading('接入与运行边界','明确哪些链路已在本地运行，哪些外部能力尚未接入。')}<div class="integration-grid">${[['chat','Web 客户服务','本地页面可用','客户咨询、历史记录、服务申请与客服工作台共享当前浏览器的数据。','good'],['book','知识与接待引擎','本地规则','使用关键词检索和确定性状态流转，不调用真实大模型或向量检索服务。',''],['plug','订单系统','外部未接入','订单信息来自内置本地适配器；没有访问商家真实订单系统。','warn'],['shield','支付与退款','未接入','记录办理结果不代表执行退款。没有资金操作、支付请求或退款回执。','warn'],['users','登录与组织','服务端未接入','角色切换用于验证岗位行为；浏览器内的校验不是身份认证或安全隔离。','warn'],['inbox','邮件、短信与其他渠道','未接入','消息只保存在当前工作空间，没有发送短信、邮件或外部通知。','warn']].map(([glyph,title,status,body,color])=>`<section class="panel integration-card"><div class="integration-icon">${icon(glyph,25)}</div><h2>${title}</h2>${pill(status,color)}<p>${body}</p></section>`).join('')}</div>`;};

  const $=s=>document.querySelector(s);let toastTimer,focusBeforeDialog;

  function download(name,value){const blob=new Blob([typeof value==='string'?value:JSON.stringify(value,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  const actions={

    'test-knowledge'(el){apply('testKnowledge',{id:el.dataset.id},'回归已运行，请查看逐项结果');render();},
    'publish-knowledge'(el){confirmation('发布知识','确认发布已通过回归的草稿？新提问将使用新版本，历史答复保留原引用。','publishKnowledge',el.dataset.id);},
    'disable-knowledge'(el){modal('停用知识',`<form data-form="disable-knowledge" data-id="${e(el.dataset.id)}">${field('停用原因','reason','','textarea','required maxlength="300"')}<button class="btn primary" type="submit">确认停用</button></form>`);},
    'test-flow'(){apply('testFlow',{},'回归已运行，请查看逐项结果');render();},
    'publish-flow'(){confirmation('发布接待策略','新咨询将使用新策略；正在进行的咨询继续使用开始时的版本。','publishFlow','');},
    'review-gap'(el){const g=D.get(store.state,'gaps',el.dataset.id);const v=formDraft('review-gap:'+g.id,{status:'confirmed',review:g.review,cause:g.cause});modal('复核服务问题',`<p class="result-note">${e(g.query)}</p><form data-form="review-gap" data-id="${e(g.id)}"><label class="field"><span>复核结论</span><select name="status">${options([['confirmed','确认问题，交给运营整改'],['dismissed','排除线索，不形成整改']],v.status)}</select></label>${field('复核依据','review',v.review,'textarea','required')}${field('根因说明（确认问题时必填）','cause',v.cause,'textarea')}<button class="btn primary" type="submit">保存复核结论</button></form>`);},
    'new-gap-knowledge'(el){const g=D.get(store.state,'gaps',el.dataset.id);if(ui.opsRole!=='operator'||!['confirmed','fixing'].includes(g.status))throw Error('请先完成问题复核');ui.knowledgeId='new';ui.prefillQuery=g.query;navigate('ops','knowledge');render();},
    'link-gap'(el){const g=D.get(store.state,'gaps',el.dataset.id);modal('关联整改知识',`<p>${e(g.query)}</p><form data-form="link-gap" data-id="${e(g.id)}"><label class="field"><span>选择用于修复的知识</span><select name="knowledgeId" required>${options(store.state.knowledge.map(k=>[k.id,(k.draft||k.live).title+' · '+k.id]),g.knowledgeId)}</select></label><p class="muted small-text">关联后仍需发布修订，并由经理用原始问题验收。</p><button class="btn primary" type="submit">保存关联</button></form>`);},
    'accept-gap'(el){modal('验证原问题并验收',`<form data-form="accept-gap" data-id="${e(el.dataset.id)}">${field('验收说明','acceptance','','textarea','required')}<p class="muted small-text">提交时重放原问题并运行全量回归，不能用手动勾选替代验证。</p><button class="btn primary" type="submit">执行验证并验收</button></form>`);},
    'confirm-action'(el){apply(el.dataset.command,{id:el.dataset.id},'操作已完成');closeModal();ui.flowTest=null;render();},
    'close-modal'(){closeModal();},
    'export-data'(){const data=apply('export',{});download('客服工作空间.json',data);toast('已生成工作空间导出文件');},
    'export-legacy'(){if(identity().role!=='admin')throw Error('需要系统管理员角色');const raw=localStorage.getItem('zhixu-customer-demo-v3.1');if(raw===null)throw Error('当前浏览器未读取到旧版本保存值');download('客服旧版本原始数据.json',raw);toast('已导出旧版本原始保存值，未做转换');},
    'export-broken'(){if(store.original===null)throw Error('无法读取原始保存值，可能是浏览器禁用了存储');download('客服异常原始数据.json',store.original);}
  };
  function assign(type,id){modal('分配负责人',`<form data-form="assign" data-id="${e(id)}" data-command="${type}"><label class="field"><span>接收客服</span><select name="ownerId">${options(store.state.staff.filter(a=>a.role==='agent').map(a=>[a.id,a.name]),'lin')}</select></label><p class="muted small-text">转派保留原受理时间和处理记录，原负责人不能继续修改任务。</p><button class="btn primary" type="submit">确认分配</button></form>`);}
  document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el||el.disabled)return;try{const handler=actions[el.dataset.action];if(!handler)throw Error('此操作不可用');handler(el);cache();}catch(err){fail(err);}});
  document.addEventListener('input',ev=>{
    const el=ev.target;
    if(el.dataset.search){ui.search[el.dataset.search]=el.value;render();return;}
    const form=el.closest('form[data-form]');if(!form)return;
    ui.drafts[form.dataset.form+':'+(form.dataset.id||'new')]=Object.fromEntries(new FormData(form));cache();
    if(form.dataset.form==='knowledge'){document.querySelectorAll('[data-action="test-knowledge"],[data-action="publish-knowledge"]').forEach(b=>b.disabled=true);clearFlowTest();}
    if(['flow','flow-query'].includes(form.dataset.form))clearFlowTest();
    if(form.dataset.form==='flow'){document.querySelectorAll('[data-action="test-flow"],[data-action="publish-flow"],[data-form="flow-query"] [type="submit"]').forEach(b=>b.disabled=true);$('[data-flow-unsaved]').hidden=false;}
  });
  document.addEventListener('change',ev=>{const el=ev.target;try{
    if(el.dataset.select==='agent'){ui.agentId=el.value;closeModal();ui.deskConversation='';render();}
    if(el.dataset.select==='ops-role'){ui.opsRole=el.value;closeModal();navigate('ops',opsMenus[ui.opsRole][0][0]);render();}
    if(el.dataset.select==='ticket-filter'){ui.ticketFilter=el.value;render();}
    cache();
  }catch(err){fail(err);}});
  document.addEventListener('submit',ev=>{
    const form=ev.target.closest('form[data-form]');if(!form)return;ev.preventDefault();
    const f=form.dataset.form,id=form.dataset.id,data=Object.fromEntries(new FormData(form)),key=f+':'+(id||'new');
    try{
      if(f==='ticket-request'){
        ui.pendingTicket={...ui.pendingTicket,...data,draftKey:key};
        modal('核对服务申请',`<div class="preview-block"><h2>${e(data.title)}</h2><p>${e(data.description)}</p>${ui.pendingTicket.caseId?`<small>关联问题：${e(ui.pendingTicket.caseId)}</small>`:`<small>客户：${e(store.state.customers.find(c=>c.id===data.customerId)?.name)}</small>`}</div><p class="muted">确认后创建或继续原工单。取消不会产生受理记录，也不会执行退款。</p><form data-form="ticket-confirm" data-id="new"><div class="form-footer">${b('取消','close-modal')}<button class="btn primary" type="submit">确认提交申请</button></div></form>`);return;
      }
      if(f==='ticket-confirm'){const request=ui.pendingTicket;if(!request)throw Error('申请已失效，请重新核对');const r=apply('createTicket',{...request,confirmed:true});delete ui.drafts[request.draftKey];ui.pendingTicket=null;toast(r.created?`已受理 ${r.id}`:`已有工单 ${r.id}，继续原记录`);closeModal();render();return;}
      if(f==='customer-say'){apply('say',{id,body:data.body});ui.customerConversation=id;}
      else if(f==='reply'||f==='note')apply(f,{id,body:data.body},f==='note'?'内部备注已保存':'回复已发送');
      else if(f==='complete-case'){apply('completeCase',{id,conversationId:form.dataset.conversation,...data},'处理结果已记录，客户确认单独统计');closeModal();}
      else if(f==='ticket-update'){apply('updateTicket',{id,...data},'处理记录已提交');closeModal();}
      else if(f==='supplement'){apply('supplement',{id,body:data.body},'补充信息已提交');closeModal();}
      else if(f==='dispute'){const conv=apply('feedback',{id,confirmed:false,reason:data.reason},'已继续原问题，原受理记录保留');if(conv)ui.customerConversation=conv;closeModal();}
      else if(f==='assign'){apply(form.dataset.command,{id,ownerId:data.ownerId},'负责人已调整');closeModal();}
      else if(f==='knowledge'){ui.knowledgeId=apply('saveKnowledge',{...data,id:id==='new'?'':id,effectiveAt:new Date(data.effectiveAt+'T00:00:00Z').toISOString(),expiresAt:data.expiresAt?new Date(data.expiresAt+'T00:00:00Z').toISOString():''},'草稿已保存，尚未发布');ui.flowTest=null;}
      else if(f==='disable-knowledge'){apply('disableKnowledge',{id,reason:data.reason},'知识已停用，历史引用保留');closeModal();}
      else if(f==='flow'){apply('saveFlow',{...data,intakeEnabled:data.intakeEnabled==='true'},'策略草稿已保存，尚未发布');ui.flowTest=null;}
      else if(f==='flow-query'){clearFlowTest();if(ui.drafts['flow:new'])throw Error('请先保存策略草稿，再运行单条测试');ui.flowTest=D.classify(store.state,data.query,'C001',Date.now(),store.state.flow.draft||store.state.flow.live,{orderFailure:data.orderFailure==='true'});toast('隔离测试完成，没有创建业务记录');}
      else if(f==='service-settings')apply('serviceSettings',{...data,accepting:data.accepting==='true'},'接待规则已更新');
      else if(f==='review-gap'){apply('reviewGap',{id,...data},'复核结论已保存');closeModal();}
      else if(f==='link-gap'){apply('linkGap',{id,knowledgeId:data.knowledgeId},'已关联整改知识');closeModal();}
      else if(f==='accept-gap'){apply('acceptGap',{id,acceptance:data.acceptance},'原问题验证及全量回归通过，已验收');closeModal();}
      else throw Error('未知表单');
      if(f!=='flow-query')delete ui.drafts[key];cache();render();if(['customer-say','reply','note'].includes(f))scrollMessages();
    }catch(err){fail(err);}
  });
  document.addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key==='Enter'&&ev.target.closest('.composer')){ev.preventDefault();ev.target.closest('form').requestSubmit();}});
  window.addEventListener('hashchange',()=>{closeModal();render();scrollMessages();});
  window.addEventListener('popstate',()=>{closeModal();render();});
  window.addEventListener('storage',ev=>{if(ev.key===window.SupportStore.KEY)toast('其他页面更新了工作空间。请刷新后继续，当前输入保留。',true);});
  window.addEventListener('error',ev=>{console.error(ev.error);toast('页面出现异常；未提交的操作不会被视为成功。',true);});
  render();scrollMessages();
})();

</script>
</body>
</html>
