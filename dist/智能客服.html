/* Chat workspaces own the viewport; only message and context panes scroll. */
#app:has(>.chat-page){height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#app:has(>.chat-page)>.topbar{flex:none}
.chat-page{display:flex;flex-direction:column;flex:1 1 0;min-height:0;width:100%;padding-bottom:12px;overflow:hidden}
.chat-page>.page-head,.chat-page>.subnav,.chat-page>.notice,.chat-page>.footer-note{flex:none}
.chat-page>.page-head{margin-bottom:12px}
.chat-page>.subnav{margin-bottom:12px}
.chat-page>.customer-layout,.chat-page>.workbench{flex:1 1 0;min-height:0;align-items:stretch}
.chat-page .chat-panel{height:auto;min-height:0;max-height:none}
.chat-page .chat-head,.chat-page .composer,.desk-chat>.panel-head,.desk-chat>.reply-form{flex:none}
.chat-page .message{flex-shrink:0}
.chat-page .customer-aside,.chat-page .queue-panel,.desk-workflow{min-height:0;max-height:none;overflow-y:auto;overscroll-behavior:contain}
.chat-page .work-main{min-height:0;grid-template-rows:minmax(0,1fr);gap:0}
.chat-page .desk-columns{min-height:0;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:minmax(0,1fr);align-items:stretch}
.desk-chat{display:flex;flex-direction:column;min-height:0}
.chat-page .desk-history{flex:1 1 0;min-height:0;max-height:none}
.chat-page .messages{overscroll-behavior:contain;scroll-behavior:auto}
.desk-chat>.reply-form{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:8px;padding:10px 16px;margin:0;background:white}
.desk-chat>.reply-form textarea{height:56px;min-height:44px;max-height:56px;resize:none}
.desk-chat>.reply-form>.help{grid-column:1/-1;font-size:10px}
.workflow-context .business-history{border-top:0;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:16px}
.desk-workflow{display:flex;flex-direction:column;min-width:0}
.desk-workflow>.panel-head{flex:none;padding:16px 18px}
.desk-workflow>.workflow-body{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:18px}
.workflow-case{margin-bottom:18px;overflow-wrap:anywhere}
.workflow-case h2{font-size:18px;margin:10px 0 6px}
.workflow-actions{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}
.workflow-actions .actions{margin-top:10px}
.workflow-actions button{font-size:12px;padding:6px 9px}
.workflow-context{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}
.workflow-context summary{cursor:pointer;font-size:13px;font-weight:600}
.workflow-context .business-history{margin-top:16px}
.compact-workflow-actions{display:none}
@media(max-width:1100px){.chat-page .desk-workflow{display:none}.compact-workflow-actions{display:inline-block}.chat-page .desk-columns{grid-template-columns:minmax(0,1fr)}}
@media(max-width:780px){
  .chat-page{padding:10px 12px 8px}
  .chat-page>.page-head{margin-bottom:8px;gap:6px}
  .chat-page>.page-head p{display:none}
  .chat-page>.page-head h1{font-size:20px}

.sop{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}

.sop-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:22px}
.sop-name{font-size:13px;font-weight:600}
.sop-row.is-current .sop-name,.sop-intent.is-hit .sop-name{color:var(--primary)}

.sop-dot{position:absolute;left:9px;top:12px;width:14px;height:14px;box-sizing:border-box;border-radius:50%;background:#fff;border:2px solid #c3cfd2}

      {id:'invoice',name:'发票服务',phrase:'需要开具发票',steps:[[ASK,'核对订单'],[ASK,'收集抬头与邮箱','由客户在「服务进度」核对确认开票申请'],[ACT,'转财务组开具',TEAM_INTAKE,true]]},
      {id:'price',name:'价格保护',phrase:'想申请价格保护',steps:[[ASK,'核对订单'],[ASK,'收集比价依据','由客户在「服务进度」核对确认价保申请'],[ACT,'转财务组核实',TEAM_INTAKE,true]]}]},
    {name:'投诉升级',intents:[
      {id:'complaint',name:'投诉建议',phrase:'对这次服务不满意',steps:[[SAY,'安抚并致歉'],[ACT,'记录投诉诉求','在「内部备注」记录投诉要点'],[ACT,'升级主管复核','通过「转派接续客服」或主管复核跟进',true]]}]}
  ];
  const INTENTS={};
  GROUPS.forEach((g,gi)=>g.intents.forEach(it=>{INTENTS[it.id]={...it,group:gi};}));
  const COMMON={
    enter:{name:'用户进线',kind:ACT},greet:{name:'欢迎语',kind:SAY},intent:{name:'意图识别',kind:ACT},
    clarify:{name:'澄清追问',kind:ASK,how:'客户说明后，按诉求引导其在「我的订单」或「服务进度」办理；本事项用「登记处理结论」收口'},
    followup:{name:'告知后续安排',kind:SAY},confirm:{name:'确认是否解决',kind:SAY},rate:{name:'满意度邀评',kind:SAY},
    end:{name:'结束 · 小结归档',kind:ACT,how:'确认无其他问题后，点击「结束本次接待」'}
  };
  const NODE_KEY=/^(greet|clarify|followup|confirm|rate|[a-zA-Z]{2,20}\.[0-9])$/;
  const BY_TYPE={return_refund:'refund',refund_only:'refundOnly',exchange:'exchange',reship:'reship',repair:'repair',invoice:'invoice',price_protection:'price',cancel_order:'cancel',change_address:'address',logistics:'logistics',payment:'order',complaint:'complaint'};
  // Titles written by the router; clarification titles stay unmapped when they do not name a single intent.
  const BY_TITLE={'核对订单归属':'order','订单支付查询':'order','支付记录核实':'order','支付状态核实':'order','物流进度':'logistics','确认未收到的商品':'logistics',
    '确认咨询商品':'usage','保温杯清洁与保养':'usage','商品选购建议':'product','确认选购用途':'product','选择查询商品':'stock',
    '核对优惠资格':'benefit','优惠资格查询':'benefit','活动规则核实':'benefit','活动与优惠使用':'benefit',
    '售后办理说明':'policy','售后规则待核实':'policy','定位售后申请':'progress','售后进度':'progress','原售后记录':'progress'};
  const LATE_RETURN=['received','inspection_review','awaiting_refund','refund_processing','refund_unknown','refund_failed'];
  const ENDED=['rejected','withdrawn','withdrawal_pending'];
  const TEAMS={service:'一线客服',aftersales:'售后组',warehouse:'仓库组',finance:'财务组'};
  const ORDER_STATUS={partially_delivered:'部分签收',awaiting_dispatch:'待发货',awaiting_payment:'待支付',delivered:'已签收',cancelled:'已取消'};
  const PACKAGE_STATUS={signed:'已签收',in_transit:'运输中',awaiting_dispatch:'待出库',cancelled:'已取消'};
  const short=(text,n=28)=>{const v=String(text||'').replace(/\s+/g,' ').trim();return v.length>n?v.slice(0,n)+'…':v;};

  // Same wording rules the router uses to tell after-sales requests apart.
  function afterSalesOf(text) {
    if(/(仅退款|只退款|不退货.{0,5}退款)/.test(text))return 'refundOnly';
    if(/换货|换一个|换一件|更换/.test(text))return 'exchange';
    if(/补发|补寄|缺配件|少配件|缺件|少件|漏发/.test(text))return 'reship';
    if(/退货|退款|想退|要退|申请退/.test(text))return 'refund';
    return null;
  }
  function intentOf(c,question='',said='') {
    if(BY_TYPE[c.type])return BY_TYPE[c.type];
    if(c.title==='选择查询订单')return /包裹/.test(question)?'logistics':'order';
    if(c.title==='确认售后商品')return afterSalesOf(said);
    if(BY_TITLE[c.title])return BY_TITLE[c.title];
    if(/使用方法$|清洁|清洗|保养/.test(c.title))return 'usage';
    if(/价格库存$/.test(c.title))return 'stock';
    if(['knowledge','query','consultation'].includes(c.type))return 'general';
    return null;
  }
  function stepStates(id,c,app) {
    const n=INTENTS[id].steps.length,st=Array(n).fill('todo'),finished=c.status==='completed';
    const doneTo=k=>{for(let i=0;i<Math.min(k,n);i++)st[i]='done';};
    const later=(k,state)=>{for(let i=k;i<n;i++)if(st[i]!=='done')st[i]=state;};
    if(c.type==='clarification'){doneTo(finished?n:id==='benefit'?1:0);return st;}
    if(['knowledge','query'].includes(c.type)){doneTo(n);return st;}
    switch(id){
      case 'refund':case 'refundOnly':case 'exchange':
        if(!app){doneTo(c.prefill?2:c.itemId?1:0);return st;}
        doneTo(3);
        if(ENDED.includes(c.stage)){later(3,'skip');return st;}
        if(c.stage==='completed'){doneTo(n);return st;}
        if(id==='refund'&&LATE_RETURN.includes(c.stage))doneTo(4);
        later(3,'async');return st;
      case 'reship':case 'repair':case 'invoice':case 'price':
        if(!app){doneTo(id==='reship'?(c.prefill?.missingName?1:0):(c.itemId||c.orderId?1:0));return st;}
        doneTo(2);
        if(ENDED.includes(c.stage))later(2,'skip');else if(finished)doneTo(n);else later(2,'async');
        return st;
      case 'cancel':case 'address':
        if(c.changeId){doneTo(2);if(finished)doneTo(n);else later(2,'async');return st;}
        if(c.stage==='investigating'){doneTo(1);later(1,'async');return st;}
        doneTo(c.orderId?1:0);return st;
      case 'logistics':doneTo(finished?n:2);if(!finished)later(2,'async');return st; // abnormal parcels wait for the warehouse
      case 'order':doneTo(finished?n:1);if(!finished)later(1,'async');return st;
      case 'complaint':
        if(c.notes.length)st[1]='done';
        if(finished)doneTo(n);else st[2]='async';
        return st;
      default:doneTo(finished?n:1);return st;
    }
  }

  function build(s,caseId,opt={}) {
    const c=s.cases.find(x=>x.id===caseId);if(!c)return null;
    const fmt=opt.fmt||(ms=>new Date(ms).toISOString().slice(5,16).replace('T',' '));
    const convs=s.conversations.filter(v=>c.conversationIds.includes(v.id));
    const msgs=convs.flatMap(v=>v.messages).slice().sort((a,b)=>a.at-b.at);
    const mine=msgs.filter(m=>m.caseIds?.includes(c.id));
    const quote=mine.find(m=>m.role==='customer');
    const question=mine.filter(m=>m.role==='assistant').at(-1);
    const sent={};for(const m of mine)if(m.role==='agent'&&m.sopNode)sent[m.sopNode]=m;
    // After takeover the router no longer reads customer messages, so a reply after a question counts as the answer.
    const answered=key=>!!sent[key]&&msgs.some(m=>m.role==='customer'&&m.at>sent[key].at);
    const app=c.applicationId?s.applications.find(r=>r.id===c.applicationId):null;
    const order=s.orders.find(o=>o.id===c.orderId),item=s.items.find(i=>i.id===c.itemId);
    const product=item?s.catalog.find(p=>p.id===item.skuId):null;
    const iid=intentOf(c,question?.body||'',quote?.body||''),hit=iid?INTENTS[iid]:null;
    const nodes={},set=(key,status,note='',time='')=>{nodes[key]={status,note,time};};
    const customer=s.customers.find(x=>x.id===c.customerId);
    set('enter','done',`${customer?.name||'客户'} · 近期订单 ${s.orders.filter(o=>o.customerId===c.customerId).length} 笔`,convs[0]?fmt(convs[0].createdAt):'');
    const firstAgent=msgs.find(m=>m.role==='agent');
    if(firstAgent)set('greet','done',`${firstAgent.senderName||'人工客服'} 已接待`,fmt(firstAgent.at));
    else if(convs.length&&convs.every(v=>v.mode==='ai'))set('greet','done','AI 已接待');
    else set('greet','todo');
    const said=quote?`客户：“${short(quote.body)}”`:'';
    set('intent','done',hit?`命中「${hit.name}」${said?' · '+said:''}`:`未能识别具体诉求${said?' · '+said:''}`,quote?fmt(quote.at):'');
    if(hit)set('clarify','skip');
    else if(c.status==='completed')set('clarify','done','处理结论：'+short(c.result?.reason||'已登记处理结果',40));
    else if(answered('clarify'))set('clarify','done','客户已补充说明',fmt(sent.clarify.at));
    else set('clarify','todo',c.type==='clarification'&&question?'待确认内容：'+question.body:c.type==='aftersales'?'已定位商品，待客户选择退货、换货或补发':c.type==='human'?'客户要求人工，诉求待确认':'');
    let steps=[],asking=c.type==='clarification'&&c.status!=='completed'&&question&&!Object.keys(sent).some(k=>k.startsWith(iid+'.'));
    if(hit){
      steps=stepStates(iid,c,app).map((status,i,all)=>{
        const key=iid+'.'+i,[kind,,how]=hit.steps[i];
        if(status==='todo'&&(kind===SAY&&sent[key]||kind===ASK&&answered(key)||kind===ACT&&how===SYSTEM&&all.slice(0,i).every(x=>x==='done')))status='done';
        all[i]=status;
        let note='';
        if(status==='done'&&sent[key])note=`${sent[key].senderName||'人工客服'} 已发送`;
        else if(status==='done'&&i===0&&item)note=`${item.name} · ${item.variant}`;
        else if(status==='done'&&i===0&&order)note=order.id;
        else if(status==='async')note=`${M.STAGES[c.stage]||c.stage} · ${TEAMS[c.groupOwnerId]||'责任组'}`;
        else if(status==='skip')note=M.STAGES[c.stage]||'已终止';
        if(app&&status==='done'&&hit.steps[i][1]==='客户确认申请')note='申请 '+app.id;
        if(asking&&status==='todo'){note='待确认内容：'+question.body;asking=false;}

    }
    const hasAsync=steps.some(x=>x.status==='async');
    // Steps another team must finish always end with telling the customer what happens next.
    const needsFollowup=hasAsync||steps.some((x,i)=>x.status==='todo'&&hit.steps[i][3]);
    const callback=s.callbacks.find(cb=>cb.caseId===c.id&&cb.status==='scheduled');
    if(!needsFollowup)set('followup','skip');
    else if(sent.followup||callback)set('followup','done',callback?`已安排 ${fmt(callback.nextAt)} 回访`:'已告知后续安排',sent.followup?fmt(sent.followup.at):'');
    else set('followup','todo',Number.isFinite(c.nextAt)?`约定 ${fmt(c.nextAt)} 前反馈`:'');
    if(c.feedback!=='pending')set('confirm','done',c.feedback==='resolved'?'客户反馈：已解决':'客户反馈：未解决',c.feedbackAt?fmt(c.feedbackAt):'');
    else set('confirm',sent.confirm?'done':'todo','',sent.confirm?fmt(sent.confirm.at):'');
    if(c.satisfaction)set('rate','done',`客户评分 ${c.satisfaction} / 5`);
    else set('rate',sent.rate?'done':'todo',sent.rate?'已邀请评价':'',sent.rate?fmt(sent.rate.at):'');
    const closed=convs.length>0&&convs.every(v=>v.status==='closed');
    set('end',closed?'done':'todo',closed?'会话已结束':'',closed&&convs[0].closedAt?fmt(convs[0].closedAt):'');
    const path=['enter','greet','intent',...(hit?steps.map(x=>x.key):['clarify']),...(needsFollowup?['followup']:[]),'confirm','rate','end'];
    const current=path.find(k=>nodes[k].status==='todo')||'';
    const done=path.filter(k=>nodes[k].status==='done').length;

    const agent=s.staff.find(a=>a.id===(opt.agentId||c.ownerId));
    const prefill=current?prefillFor(current):null;
    function nameOf(key){if(COMMON[key])return COMMON[key].name;const [id,i]=key.split('.');return INTENTS[id].name+' · '+INTENTS[id].steps[Number(i)][1];}
    function kindOf(key){if(COMMON[key])return COMMON[key].kind;const [id,i]=key.split('.');return INTENTS[id].steps[Number(i)][0];}

      const what=item?item.name:'这件商品';
      switch(key){
        case 'greet':return hit?[`您好，我是${me}，已经看到您${hit.phrase}，接下来由我为您处理。`,`您好，我是${me}，关于${hit.name}的问题我来继续跟进，请稍等我核实一下。`]:[`您好，我是${me}，很高兴为您服务，请问有什么可以帮您？`,`您好～我是${me}，请问今天有什么可以帮您？`];
        case 'clarify':return c.type==='aftersales'?[`请问${what}您希望退货退款、换货，还是补发缺失配件呢？选好后我帮您整理申请。`,`为了准确处理，请问${what}您想怎么处理：退货退款、换货还是补发？`]:['为了更快帮您处理，请问是哪件商品、遇到了什么问题呢？您也可以在订单里直接选择具体商品。','不好意思，想跟您确认一下：您是想咨询商品、查询订单物流，还是办理售后呢？'];
        case 'followup':return [`${subject}已在办理中，当前状态：${M.STAGES[c.stage]||'处理中'}。${TEAMS[c.groupOwnerId]||'责任组'}${due?'会在 '+due+' 前':'会尽快'}给您反馈，进度也可以在「服务进度」查看。`,`${subject}已经交给${TEAMS[c.groupOwnerId]||'责任组'}跟进，有结果会第一时间通知您，也可以随时在「服务进度」查看。`];
        case 'confirm':return ['请问还有其他可以帮您的吗？','这个问题先帮您处理到这里，请问还有其他需要帮忙的吗？'];
        case 'rate':return ['不客气，感谢您的耐心！方便的话请在「服务进度」里为本次服务评价，祝您生活愉快～','感谢您的理解与配合！欢迎对本次服务做个评价，祝您生活愉快～'];

      switch(id+'.'+step){
        case 'product.确认咨询商品':case 'usage.识别商品':case 'stock.确认商品规格':return ['请问您想了解的是哪件商品呢？可以直接告诉我商品名称，或在订单里选择。'];
        case 'product.给出选购建议':return product?[`${product.name}：${product.description} 可选规格：${variants}。`]:[];
        case 'usage.答复使用方法':return product?[`${product.name}的使用与清洁：${product.care}`]:[];
        case 'stock.说明以下单为准':return product?[`${product.name}当前标价 ${M.amount(product.priceCents)}，${variants}。以实际下单时的价格和库存为准。`]:[];
        case 'benefit.识别权益类型':return ['请问您想了解的是哪一类优惠呢？优惠券、活动还是会员权益？'];
        case 'benefit.核对本人资格':return ['请在「优惠查询」中选择这笔订单和想用的优惠券，我帮您核对商品范围、使用门槛和有效期。'];
        case 'benefit.说明门槛与有效期':return ['优惠是否可用以订单页实际显示为准，下单时记得勾选对应优惠券；资格查询不会自动改价或补差。'];
        case 'order.核对本人订单':case 'logistics.核对订单与包裹':return order?[`帮您找到订单 ${order.id}（${s.items.filter(x=>x.orderId===order.id).map(x=>x.name).join('、')}），是这一笔吗？`]:[`请问是哪一笔订单呢？您可以在「我的订单」里直接选择，我帮您${id==='logistics'?'查对应包裹':'核对订单状态'}。`];

        case 'refund.收集原因与凭证':case 'refundOnly.收集原因与凭证':return [`非常抱歉给您带来不便！麻烦说明一下${what}的具体问题，方便的话拍张照片，我帮您整理${type}申请，提交前会请您核对确认。`,`抱歉让您遇到这个问题。方便发一张${what}问题位置的照片吗？我来帮您整理申请。`];
        case 'exchange.选择目标规格':return [variants?`可以为您办理换货。请问想换成哪个规格呢？目前可选：${variants}。`:'可以为您办理换货，请问想换成哪个规格呢？'];
        case 'refund.客户确认申请':case 'refundOnly.客户确认申请':case 'exchange.客户确认申请':return c.prefill?[`已为您整理好${type}申请：${what}，原因「${c.prefill.reason}」。请在「服务进度」中打开申请，核对商品、原因和材料后由您确认提交。`]:c.itemId?[`请在「服务进度」中打开${type}申请，核对商品、原因和材料后由您确认提交。`]:[`请在「我的订单」中选择这件商品发起${hit.name}申请，核对商品、原因和材料后由您确认提交。`];
        case 'reship.确认缺失内容':return ['抱歉给您添麻烦了！请问缺少的是哪个配件、数量多少呢？'];

          return [`帮您核对了这笔订单的包裹：${packs.map(p=>`${p.itemIds.map(x=>s.items.find(i=>i.id===x)?.name).join('、')}${PACKAGE_STATUS[p.status]||p.status}`).join('；')}。${moving?'还有包裹在途，建议送达后再确认是否缺件。':'没有另包在途，可以为您登记补发。'}`];

        case 'progress.告知下次反馈':return app?[`您的${M.TYPES[app.type]||''}申请 ${app.id} 目前：${M.STAGES[app.stage]||app.stage}${due?'，我们会在 '+due+' 前给您反馈':''}。`]:[];
        case 'invoice.核对订单':case 'price.核对订单':return ['请问是哪一笔订单呢？可以在「我的订单」里直接选择。'];
        case 'invoice.收集抬头与邮箱':return ['请提供发票抬头、税号（企业必填）和接收邮箱，我帮您提交开票申请。'];
        case 'price.收集比价依据':return ['请提供降价活动页面或截图作为比价依据，我帮您提交价保申请。'];
        case 'complaint.安抚并致歉':return ['非常抱歉给您带来不好的体验！我会完整记录您的问题，请您具体说说发生了什么。','很抱歉让您失望了，您的意见我们非常重视，麻烦说一下具体情况，我来跟进。'];
        default:return [];
      }
    }

    // Rows in display order; everything before the current node sits on the lit part of the axis.
    const label=key=>COMMON[key]?COMMON[key].name:INTENTS[key.split('.')[0]].steps[Number(key.split('.')[1])][1];
    const shown=key=>({...nodes[key],key,name:label(key),status:key===current?'current':nodes[key].status==='todo'?'next':nodes[key].status});
    const groups=GROUPS.map((g,gi)=>({name:g.name,hit:!!hit&&hit.group===gi,count:g.intents.length,
      intents:g.intents.map(it=>({id:it.id,name:it.name,hit:it.id===iid,status:!hit?'pending':it.id===iid?'done':'dim',
        stepsText:it.steps.map(x=>x[1]).join(' → '),steps:it.id===iid?steps.map(x=>shown(x.key)):[]}))}));
    const stages=[
      {num:'01',title:'接入',nodes:[shown('enter'),shown('greet')]},
      {num:'02',title:'识别',nodes:[shown('intent'),shown('clarify')]},
      {num:'03',title:'分流办理',meta:`${GROUPS.length} 类 · ${Object.keys(INTENTS).length} 个意图`,groups},
      {num:'04',title:'收尾',nodes:['followup','confirm','rate','end'].map(shown)}
    ];
    // The rail is solid up to the furthest node reached: the current node, a finished node or the matched intent.
    const flow=[...stages[0].nodes,...stages[1].nodes,...groups.flatMap(g=>[g,...g.intents.flatMap(it=>[it,...it.steps])]),...stages[3].nodes];
    const reached=flow.reduce((n,r,i)=>r.status==='current'||r.status==='done'&&r.key||r.hit?i:n,-1);
    flow.forEach((r,i)=>{r.lit=!current||i<=reached;});
    stages[0].lit=false;stages[1].lit=stages[1].nodes[0].lit;stages[2].lit=groups[0].lit;stages[3].lit=stages[3].nodes[0].lit;
    const last=msgs.at(-1);
    return {caseId:c.id,intent:hit?{id:hit.id,name:hit.name,group:GROUPS[hit.group].name}:null,path,nodes,current,currentLabel:current?nameOf(current):'',
      done,total:path.length,stages,prefill,awaitingCustomer:last?.role==='agent'};
  }
  const api={GROUPS,INTENTS,NODE_KEY,intentOf,build};
  if(typeof module!=='undefined'&&module.exports)module.exports=api;else root.SupportV2Sop=api;
})(typeof window!=='undefined'?window:globalThis);

</script>
<script>
/* Three workspaces over one local scenario model. All dynamic HTML is escaped; uploaded images stay local. */
(function () {
  'use strict';
  const M=window.SupportV2Model,S=window.SupportV2Service,P=window.SupportV2Sop;
  const KEY='support-ecommerce-v2';
  const e=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const t=v=>Number.isFinite(Number(v))?new Date(Number(v)).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}):'待安排';
  const time=v=>new Date(v).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
  const isoLocal=milliseconds=>{const d=new Date(milliseconds);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);};
  const groups={service:'一线客服',aftersales:'售后组',warehouse:'仓库组',finance:'财务组'};
  const stage=v=>S.STAGES[v]||v;
  const orderLabel=v=>({partially_delivered:'部分签收',awaiting_dispatch:'待发货',awaiting_payment:'待支付',delivered:'已签收',cancelled:'已取消'}[v]||v);
  const staffName=id=>state.staff.find(a=>a.id===id)?.name||'待接待';
  const badge=(label,tone='')=>`<span class="badge ${tone}">${e(label)}</span>`;
  const stageBadge=c=>badge(stage(c.stage),c.dispute?.open?'bad':['completed','queried'].includes(c.stage)?'good':['answered','pending_review','waiting_customer','awaiting_refund','refund_unknown','inspection_review','withdrawal_pending'].includes(c.stage)?'warn':'blue');
  const btn=(label,action,attrs='',cls='')=>`<button type="button" class="${cls}" data-action="${action}" ${attrs}>${e(label)}</button>`;
  const empty=(title,text)=>`<div class="empty"><h3>${e(title)}</h3><p>${e(text)}</p></div>`;
  const kv=rows=>`<dl class="kv">${rows.filter(row=>row[1]!==undefined&&row[1]!==null&&row[1]!=='').map(([k,v])=>`<dt>${e(k)}</dt><dd>${e(v)}</dd>`).join('')}</dl>`;
  const field=(name,label,value='',type='text',extras='')=>`<div class="field"><label for="f-${name}">${e(label)}</label><input id="f-${name}" name="${name}" type="${type}" value="${e(value)}" ${extras}></div>`;
  const area=(name,label,value='',extras='')=>`<div class="field"><label for="f-${name}">${e(label)}</label><textarea id="f-${name}" name="${name}" ${extras}>${e(value)}</textarea></div>`;
  const select=(name,label,options,value='',extras='')=>`<div class="field"><label for="f-${name}">${e(label)}</label><select id="f-${name}" name="${name}" ${extras}>${options.map(([v,txt])=>`<option value="${e(v)}" ${String(v)===String(value)?'selected':''}>${e(txt)}</option>`).join('')}</select></div>`;
  const check=(name,label,value)=>`<label class="check-label"><input type="checkbox" name="${name}" ${value?'checked':''}>${e(label)}</label>`;
  let state,corrupt=null,storageAvailable=true,original=null,editingAllowed=true,editingNotice='另一页面正在编辑，本页仅供查看；关闭编辑页后刷新即可继续。';
  try {original=localStorage.getItem(KEY);}catch(err){storageAvailable=false;}
  if(!storageAvailable||original===null)state=M.createState();
  else try {state=JSON.parse(original);S.validateState(state);}catch(err){corrupt=err.message;state=null;}
  const ui={view:'customer',page:'chat',opsPage:'dashboard',deskActor:'lin',opsActor:'operator',caseId:'',queueFilter:'all',conversationId:state?.conversations.find(c=>c.customerId==='C001'&&c.status==='open')?.id||'',modal:'',form:null,replyDraft:null,sopAlt:null,queueTab:'',sessionFilter:'active',convId:''};
  const $=s=>document.querySelector(s),app=$('#app'),dialog=$('#dialog');
  function actor(){if(ui.view==='customer')return {id:'C001',role:'customer'};const a=state.staff.find(a=>a.id===(ui.view==='desk'?ui.deskActor:ui.opsActor));return {id:a.id,role:a.role};}
  function run(command,data,who=actor()) {
    if(corrupt||!state)throw new Error('本地记录需要检查，请保留原始记录后处理。');
    if(!editingAllowed)throw new Error(editingNotice);
    if(storageAvailable&&localStorage.getItem(KEY)!==original)throw new Error('记录已在其他页面改变，请刷新后重新核对；本次操作未保存。');
    const result=S.execute(state,who,command,data,Date.now());
    if(storageAvailable){try{const encoded=JSON.stringify(result.state);localStorage.setItem(KEY,encoded);if(localStorage.getItem(KEY)!==encoded)throw new Error('写后读取不一致');original=encoded;}catch(err){throw new Error('本地保存失败，本次修改尚未生效。请减少材料大小或释放浏览器空间后重试。');}}
    state=result.state;return result.value;
  }
  function toast(text,error=false){const el=$('#toast');el.textContent=text;el.className=error?'error':'';el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,4500);}
  function showError(err){if(dialog.open){$('#dialog-error').textContent=err.message||String(err);$('#dialog-error').hidden=false;}else toast(err.message||String(err),true);}
  function modal(title,html,label='服务办理'){ui.modal=label;$('#dialog-title').textContent=title;$('#dialog-label').textContent='服务办理';$('#dialog-error').hidden=true;$('#dialog-body').innerHTML=html;if(!dialog.open)dialog.showModal();}
  function close(){dialog.close();ui.modal='';$('#dialog-error').hidden=true;}
  function currentConversation(){let cv=state.conversations.find(c=>c.id===ui.conversationId&&c.customerId==='C001');if(!cv){cv=state.conversations.find(c=>c.customerId==='C001'&&c.status==='open')||state.conversations.find(c=>c.customerId==='C001');ui.conversationId=cv?.id||'';}return cv;}
  const myOrders=()=>state.orders.filter(o=>o.customerId==='C001');
  const myCases=()=>state.cases.filter(c=>c.customerId==='C001'&&!c.mergedInto);
  function ensureOpen(){let cv=currentConversation();if(!cv||cv.status==='closed'){ui.conversationId=run('newConversation',{}, {id:'C001',role:'customer'});cv=currentConversation();}return cv;}
  function top(){return `<header class="topbar"><div class="brand"><span class="mark" aria-hidden="true"></span>客户服务平台</div><nav class="topnav" aria-label="工作空间">${[['customer','消费者服务'],['desk','客服工作台'],['ops','运营管理']].map(([v,l])=>`<button type="button" data-view="${v}" class="${ui.view===v?'active':''}">${l}</button>`).join('')}</nav><div class="session-label">${ui.view==='customer'?'客户 001':e(staffName(actor().id))}</div></header>`;}
  function subnav(rows,current,attr='data-page'){return `<nav class="subnav" aria-label="功能导航">${rows.map(([p,l])=>`<button type="button" ${attr}="${p}" class="${p===current?'active':''}">${l}</button>`).join('')}</nav>`;}
  function render(){if(corrupt||!state){app.innerHTML=empty('本地记录需要检查','现有数据未被覆盖。请保留浏览器原记录，使用另一浏览器打开本版本，或先导出旧记录再处理。');return;}app.innerHTML=top()+`<main class="page ${ui.view==='desk'||ui.view==='customer'&&ui.page==='chat'?'chat-page':''}">${!editingAllowed?'<div class="notice warn">'+e(editingNotice)+'</div>':''}${ui.view==='customer'?customer():ui.view==='desk'?desk():operations()}${!storageAvailable?'<p class="footer-note">当前浏览器未启用本地保存，关闭窗口后新内容可能丢失。</p>':''}</main>`;const list=$('.messages');if(list)list.scrollTop=list.scrollHeight;}
  function customer(){return `<div class="page-head"><div><p class="eyebrow">CUSTOMER SERVICE</p><h1>${({chat:'咨询与办理',orders:'我的订单',products:'商品与选购',progress:'服务进度'})[ui.page]}</h1><p>查询有依据，办理有进度。未完成的问题可以继续接着处理。</p></div>${btn('联系人工','human','','')}</div>`+subnav([['chat','在线咨询'],['orders','我的订单'],['products','商品选购'],['progress','服务进度']],ui.page)+({chat:chatView,orders:ordersView,products:catalogView,progress:progressView}[ui.page]||chatView)();}
  function legacyReply(m,conv) {
    if(m.role!=='system'||m.kind)return false;
    // Older records identify only the first human reply. Do not guess other senders from their wording.
    return m.caseIds?.some(id=>state.cases.some(c=>c.id===id&&c.firstHumanReplyAt===m.at&&
      conv.messages.filter(other=>other.at===m.at&&other.caseIds?.includes(id)).length===1));
  }
  function conversationMessages(conv) {
    if(!conv)return [];
    return conv.messages.map(m=>legacyReply(m,conv)?{...m,role:'agent'}:m).slice().sort((a,b)=>a.at-b.at);
  }
  function messageView(m){const label=m.role==='customer'?(ui.view==='customer'?'您':'客户'):m.role==='agent'?(m.senderName||'人工客服'):m.role==='assistant'?'AI 客服':'系统通知',avatar=m.role==='customer'?'客户':m.role==='assistant'?'AI':'客服';return `<div class="message ${e(m.role)}" data-message-id="${e(m.id)}">${m.role!=='system'?`<span class="avatar" aria-hidden="true">${avatar}</span>`:''}<div class="message-content"><div class="message-sender">${e(label)}</div><div class="bubble">${e(m.body)}</div>${m.source?`<span class="source">依据：${e(m.source)}</span>`:''}${m.action&&ui.view==='customer'?`<div class="message-actions">${btn(({orders:'选择订单',products:'查看商品',coupon:'优惠查询',progress:'查看进度',aftersales:'核对售后申请',cancel_order:'取消订单',change_address:'修改地址',invoice:'发票服务',repair:'维修服务',price_protection:'价保核实'})[m.action]||'继续办理','message-action',`data-kind="${e(m.action)}" data-order="${e(m.orderId||'')}" data-item="${e(m.itemId||'')}" data-case="${e(m.caseIds?.[0]||'')}"`,'small')}</div>`:''}<div class="message-meta">${e(time(m.at))}${m.caseIds?.length?' · '+m.caseIds.map(cid=>`<button class="link" data-action="case" data-case="${e(cid)}">${e(cid)}</button>`).join('、'):''}</div></div></div>`;}
  function mini(c){return `<div class="case-mini"><div class="row between"><span class="case-id">${e(c.id)}</span>${stageBadge(c)}</div><h4>${btn(c.title,'case',`data-case="${e(c.id)}"`,'link')}</h4><div class="small muted">${e(groups[c.groupOwnerId]||'服务组')} · ${c.status==='completed'?'已保留处理记录':'下次反馈 '+e(t(c.nextAt))}</div></div>`;}
  function chatView(){const cv=currentConversation(),pending=myCases().filter(c=>c.status!=='completed'&&!['withdrawn','rejected'].includes(c.stage));return `<div class="customer-layout"><section class="panel chat-panel"><div class="chat-head"><div><h3>在线客服</h3><div class="chat-status"><span class="dot"></span>${cv?.status==='closed'?'本次会话已结束':cv?.mode==='human'?'由 '+e(staffName(cv.ownerId))+' 接待':cv?.mode==='queue'?'等待人工接续，事项已保留':'智能接待，可随时转人工'}</div></div><div class="row">${btn('历史咨询','history','','quiet small')}${btn('新建咨询','new-chat','','small')}</div></div><div class="messages self-right" aria-live="polite">${conversationMessages(cv).map(messageView).join('')||empty('开始咨询','描述您需要了解或办理的问题。')}</div><div class="composer"><div class="quick-actions">${btn('查订单','goto-orders')}${btn('申请售后','application')}${btn('优惠查询','coupon')}${btn('服务进度','goto-progress')}</div><form id="chat-form"><textarea aria-label="咨询内容" name="body" id="chat-input" placeholder="例如：杯子怎么清洗？订单的另一个包裹到哪了？" required maxlength="4000"></textarea><button class="primary" type="submit">发送</button></form><div class="composer-hint">Enter 发送 · Shift + Enter 换行。业务申请在核对确认后提交。</div></div></section><aside class="customer-aside stack"><div class="hero-note"><h3>已有信息不必重复填写</h3><p>选择订单后，可接着查询包裹、整理申请或跟进原事项。</p>${btn('查看我的订单','goto-orders')}</div><section class="panel"><div class="panel-head"><h3>正在跟进</h3>${badge(pending.length+'项')}</div><div class="panel-body">${pending.slice(0,4).map(mini).join('')||'<p class="small muted">目前没有待处理事项。</p>'}</div></section><section class="panel"><div class="panel-body"><div class="side-grid"><div><div class="side-stat">${myOrders().length}</div><div class="small muted">本人订单</div></div><div><div class="side-stat">${state.applications.filter(a=>a.customerId==='C001').length}</div><div class="small muted">服务申请</div></div></div><hr class="rule"><p class="small muted">受理、审核与执行分别展示；如对结果有异议，可继续原事项复核。</p></div></section></aside></div>`;}
  function ordersView(){return `<div class="order-grid">${myOrders().map(o=>{const pay=state.payments.find(p=>p.orderId===o.id);return `<section class="panel order-card"><div class="order-top row between"><span class="order-id">${e(o.id)}</span>${badge(orderLabel(o.status),o.status==='cancelled'?'':'blue')}</div>${state.items.filter(i=>i.orderId===o.id).map(i=>{const p=state.packages.find(p=>p.itemIds.includes(i.id));return `<div class="order-item"><div class="product-icon">${i.skuId==='EC-SKU-CUP'?'保温杯':i.skuId==='EC-SKU-BAG'?'收纳袋':'收纳盒'}</div><div class="grow"><div class="row between"><h3>${e(i.name)}</h3><span>${M.amount(i.paidCents)}</span></div><div class="muted">${e(i.variant)} · 数量 ${i.quantity}</div><div class="small muted">${e(S.packLabel(p))}${p.tracking?' · '+e(p.tracking):''}</div><div class="actions">${btn('查询物流','query-logistics',`data-order="${e(o.id)}" data-item="${e(i.id)}"`,'small')}${btn('咨询此商品','context',`data-order="${e(o.id)}" data-item="${e(i.id)}"`,'small')}${o.status!=='cancelled'?btn('申请售后','application',`data-order="${e(o.id)}" data-item="${e(i.id)}"`,'small'):''}</div></div></div>`;}).join('')}<div class="order-footer"><div class="row between"><span class="small muted">${e(S.payLabel(pay))}</span>${pay?.queryStatus==='ok'&&pay.status==='paid'?`<span>实付 <strong class="price">${M.amount(pay.amountCents)}</strong></span>`:''}</div><div class="actions">${btn('支付核实','query-order',`data-order="${e(o.id)}"`,'small')}${o.status!=='cancelled'?btn('取消订单','application',`data-kind="cancel_order" data-order="${e(o.id)}"`,'small')+btn('修改地址','application',`data-kind="change_address" data-order="${e(o.id)}"`,'small'):''}${btn('发票 / 价保 / 维修','other-services',`data-order="${e(o.id)}"`,'small')}</div><div class="address-line">收货信息：${e(o.address.name)} · ${e(o.address.phone.replace(/(\d{3})\d{4}(\d+)/,'$1****$2'))} · ${e(o.address.text)}</div></div></section>`;}).join('')}</div>`;}
  function catalogView(){return `<div class="catalog-grid">${state.catalog.map((p,i)=>`<article class="panel"><div class="catalog-art" aria-hidden="true"><div class="catalog-shape ${['cup','bag','box'][i]}"></div></div><div class="catalog-body"><div class="row between"><h3>${e(p.name)}</h3><strong class="price">${M.amount(p.priceCents)}</strong></div><p>${e(p.description)}</p><div class="attributes">${p.attributes.map(a=>`<span class="attribute">${e(a)}</span>`).join('')}</div><p>${p.variants.map(v=>e(v.label)+' · '+(v.stock>0?'有货':'暂时无货')).join('<br>')}</p><div class="actions">${btn('了解使用方式','ask-product',`data-text="${e(p.name+'怎么清洗')}"`,'small')}${btn('帮我选规格','ask-product',`data-text="${e(p.name+'适合什么用途，怎么选')}"`,'small')}</div><span class="source">${e(p.source)} · ${e(t(p.queriedAt))}</span></div></article>`).join('')}</div><div class="notice" style="margin-top:20px">商品属性与活动规则分别核对。${btn('查询本人订单的优惠资格','coupon','','link')}</div>`;}
  function progressView(){const rows=myCases();return rows.length?`<div class="progress-grid">${rows.map(c=>`<article class="panel progress-card"><div class="row between"><span class="case-id">${e(c.id)}</span>${stageBadge(c)}</div><h3>${e(c.title)}</h3><p class="desc">${e(c.description||c.result?.body?.slice(0,80)||'已保留本次咨询与处理记录。')}</p><div class="small muted" style="margin-top:12px">${e(groups[c.groupOwnerId]||'客服组')} · ${c.ownerId?e(staffName(c.ownerId)):'待责任组接续'}${c.status!=='completed'?'<br>下次反馈 '+e(t(c.nextAt)):''}</div><div class="actions">${btn('查看进度与操作','case',`data-case="${e(c.id)}"`,'small primary')}</div></article>`).join('')}</div>`:empty('暂无服务事项','咨询问题或确认申请后，可以在这里查看进度和后续安排。');}
  const application=c=>state.applications.find(r=>r.caseId===c.id);
  const refund=c=>state.refunds.find(r=>r.caseId===c.id);
  const returnOf=c=>state.returns.find(r=>r.applicationId===c.applicationId);
  function history(c,conv=null){
    const shown=conv?conversationMessages(conv).filter(m=>m.role==='agent'&&m.caseIds?.includes(c.id)):[];
    const rows=c.history.filter(h=>!shown.some(m=>m.at===h.at&&m.body===h.text));
    return `<ul class="timeline">${rows.length?rows.slice().reverse().map(h=>`<li><span class="time">${e(t(h.at))}</span><div>${h.kind==='reply'?e(h.senderName||'人工客服')+'：':''}${e(h.text||stage(h.stage))}</div></li>`).join(''):'<li>已保留原始咨询，尚无新的业务办理进展。</li>'}</ul>`;

    if(el.name==='deskActor'){ui.deskActor=el.value;render();return;}if(el.name==='opsActor'){ui.opsActor=el.value;render();return;}if(el.name==='queueFilter'||el.name==='queueDialogFilter'){ui.queueFilter=el.value;render();if(el.name==='queueDialogFilter')openDeskQueue();return;}if(el.name==='sessionFilter'||el.name==='sessionDialogFilter'){ui.sessionFilter=el.value;render();if(el.name==='sessionDialogFilter')openDeskQueue();return;}
    if(el.closest('#application-form')&&['type','orderId','itemId'].includes(el.name)){captureApplication();if(el.name==='orderId'){ui.form.itemId='';for(const k of ['targetVariant','addressName','addressPhone','addressText'])delete ui.form[k];ui.form.sourceCaseId='';}if(el.name==='itemId')delete ui.form.targetVariant;if(el.name==='type')for(const k of ['targetVariant','missingName','invoiceTitle','taxId','comparison'])delete ui.form[k];applicationForm();return;}
    if(el.id==='material-file'&&el.files?.length){if(ui.modal==='application')captureApplication();else if(ui.modal==='supplement'){const fd=new FormData($('#supplement-form'));ui.form.reason=fd.get('reason');ui.form.attachmentIds=fd.getAll('attachmentIds');}const file=el.files[0];if(file.size>512000)throw Error('单张图片不能超过500KB，请选择较小的照片');if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('仅支持PNG、JPEG和WebP图片');const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('材料读取失败'));reader.readAsDataURL(file);});const id=run('addAttachment',{name:file.name,mime:file.type,size:file.size,dataUrl});ui.form.attachmentIds=[...(ui.form.attachmentIds||[]),id].slice(-3);if(ui.modal==='application')applicationForm();else showSupplement();toast('图片已添加，请核对后提交');}
  }catch(err){showError(err);}});
  document.addEventListener('keydown',event=>{if(event.target.id==='chat-input'&&event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();$('#chat-form').requestSubmit();}});
  $('#dialog-close').addEventListener('click',close);
  dialog.addEventListener('cancel',()=>{ui.modal='';});
  // Read the current value: queued storage events may describe an older write.
  window.addEventListener('storage',event=>{if(event.key!==KEY||!state||!storageAvailable)return;try{const raw=localStorage.getItem(KEY);if(raw===original)return;const fresh=JSON.parse(raw);S.validateState(fresh);if(fresh.revision<=state.revision)throw new Error('记录版本变化');state=fresh;original=raw;if(dialog.open){close();toast('同一浏览器的记录已变化，请重新打开并核对后提交');}render();}catch(err){toast('另一窗口的记录无法读取，请刷新后检查；当前内容未覆盖');}});
  if(storageAvailable){
    editingAllowed=false;
    if(typeof navigator!=='undefined'&&navigator.locks?.request)navigator.locks.request(KEY,{mode:'exclusive',ifAvailable:true},lock=>{
      if(!lock){render();return;}
      editingAllowed=true;render();
      return new Promise(()=>{}); // Hold the edit lock until the document unloads.
    }).catch(()=>{editingAllowed=false;render();toast('无法取得编辑权限，请关闭其他页面后刷新重试。');});
    else editingNotice='本页仅供查看。当前浏览器不支持安全编辑，请使用现代浏览器通过本地 HTTP 地址打开。';
  }
  // Waiting times tick in place so drafts and scroll positions survive.
  if(typeof setInterval==='function')setInterval(()=>{for(const el of document.querySelectorAll?.('[data-since]')||[])el.textContent=el.dataset.prefix+ago(Date.now()-Number(el.dataset.since));},30000);
  render();
})();

</script>
</body>
</html>
